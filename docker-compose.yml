services:
  app:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    image: mynotes:latest
    container_name: mynotes
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Phnom_Penh
    ports:
      - "8080:8080"
    volumes:
      - mynotes-data:/data
    stop_grace_period: 20s

volumes:
  mynotes-data:
