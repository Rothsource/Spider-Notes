services:
  app:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    image: spider-notes:latest
    container_name: spider-notes
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Phnom_Penh
    ports:
      - "8080:8080"
    volumes:
      - spider-notes-data:/data
    stop_grace_period: 20s

volumes:
  spider-notes-data:
