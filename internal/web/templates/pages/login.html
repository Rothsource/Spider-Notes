{{define "content"}}
<div class="login-wrap">
  <div class="login-brand">
    <img class="login-logo" src="/static/icon.svg?v={{.V}}" alt="" width="56" height="56">
    <h1>Spider Notes</h1>
    <p class="muted">Your tasks, reminders and memos, in one web.</p>
  </div>
  <form class="card login" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.LoginCSRF}}">
    <label>Username
      <input name="username" autocomplete="username" required autofocus value="{{with .Username}}{{.}}{{end}}">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary block">Sign in</button>
  </form>
</div>
{{end}}
