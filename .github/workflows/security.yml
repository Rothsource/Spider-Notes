name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 2 * * 1" # every Monday: catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    name: Static analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      # Exceptions are documented inline with "#nosec <rule> -- reason".
      - run: gosec -exclude-dir=.claude ./...

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not just the latest
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      # Uses .gitleaks.toml (default rules + test-fixture allowlist).
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  image:
    name: Container image scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t spider-notes:scan .
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress spider-notes:scan
